    <meta name="description" content="Lukuloitsu on peli, jossa opit konsonanttitekniikan: muistisäännön, jolla muistat minkä tahansa luvun.">
    <meta name="theme-color" content="#17171f">
    <link rel="canonical" href="https://lukuloitsu.fi/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Lukuloitsu">
    <meta property="og:locale" content="fi_FI">
    <meta property="og:url" content="https://lukuloitsu.fi/">
    <meta property="og:title" content="Lukuloitsu">
    <meta property="og:description" content="Opi konsonanttitekniikka pelaamalla: muista minkä tahansa luku muuttamalla se sanoiksi.">

    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #17171f;
        }
        /* The game takes every touch itself: no scrolling, zooming or
           text selection in the page. */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            outline: none;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #17171f;
            color: #f4c430;
            font: bold 28px sans-serif;
            pointer-events: none;
        }
        /* The game is made for a landscape screen, and a phone held upright
           shows it tiny. */
        #turn {
            display: none;
        }
        @media (orientation: portrait) and (pointer: coarse) {
            #turn {
                display: flex;
                position: fixed;
                inset: 0;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 24px;
                background: #17171f;
                color: #f4c430;
                font: bold 26px sans-serif;
                text-align: center;
                padding: 24px;
            }
            #turn span {
                font-size: 72px;
            }
        }
        noscript {
            color: #eee;
            font: 20px sans-serif;
            position: absolute;
            top: 40%;
            width: 100%;
            text-align: center;
        }
    </style>
</head>
<body>
    <canvas id="glcanvas" tabindex="1"></canvas>
    <div id="loading">Ladataan…</div>
    <div id="turn"><span>&#x1F4F1;&#x21BA;</span>Käännä laite vaakatasoon</div>
    <noscript>Lukuloitsu tarvitsee JavaScriptin. <a href="tietosuoja.html" style="color:#f4c430">Tietosuoja</a></noscript>
    <script>
        // A hidden page gets no frames, so the game can't stop its own
        // music when she switches to another tab or app. The page does it
        // instead, pausing all sound while it is hidden. This must run
        // before mq_js_bundle.js, which takes AudioContext when it loads.
        (function () {
            const Original = window.AudioContext || window.webkitAudioContext;
            if (!Original) {
                return;
            }
            const contexts = [];
            class Tracked extends Original {
                constructor(...args) {
                    super(...args);
                    contexts.push(this);
                    // A page opened in a background tab starts hidden.
                    if (document.hidden) {
                        this.suspend().catch(function () {});
                    }
                }
            }
            window.AudioContext = Tracked;
            if (window.webkitAudioContext) {
                window.webkitAudioContext = Tracked;
            }
            document.addEventListener("visibilitychange", function () {
                for (const context of contexts) {
                    // Resuming fails before she has touched the page, which
                    // browsers require before playing sound; that's fine.
                    const change = document.hidden ? context.suspend() : context.resume();
                    change.catch(function () {});
                }
            });
        })();
    </script>

         It doesn't count visits from localhost. -->

    <script src="mq_js_bundle.js"></script>
    <script src="lukuloitsu.js"></script>
    <script>load("lukuloitsu.wasm");</script>
</body>
</html>

[package]
name = "lukuloitsu"
version = "0.5.0"
edition = "2024"
description = "A game for learning the Finnish consonant technique, a way to remember numbers"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vpeurala/lukuloitsu.fi"
homepage = "https://lukuloitsu.fi"

# The rules and state machines live in `core`, which has no graphics,
# sound or clock; this crate is the shell around them. `default-members`
# makes a plain `cargo test` or `cargo clippy` cover both.
[workspace]
members = ["core"]
default-members = [".", "core"]

# Lints beyond clippy's defaults, kept clean in both crates. Exact float
# comparisons are still fine in tests, which check exact constants.
[workspace.lints.clippy]
format_push_string = "warn"
unused_self = "warn"
float_cmp = "warn"

[lints]
workspace = true

[dependencies]
lukuloitsu-core = { path = "core" }
macroquad = { version = "0.4.16", features = ["audio"] }
# The booklet uses it to encode pictures. macroquad has its own, older copy,
# so the two are built side by side (about 1% more web download).
image = { version = "0.25", default-features = false, features = ["png"] }

# Optimize dependencies even in debug builds so the game runs smoothly,
# while keeping our own code fast to compile.
[profile.dev.package."*"]
opt-level = 3

# Android packaging, used by `cargo quad-apk` (see scripts/android.sh).
[package.metadata.android]
# Android loads the game's library by the last part of this name, so it
# must match the crate name.
package_name = "fi.lukuloitsu.lukuloitsu"
label = "Lukuloitsu"
# The version name follows the crate's version by itself. Android also
# needs a whole number that only ever grows: major * 10000 + minor * 100 +
# patch, so 0.4.0 is 400.
version_code = 500
android_version = 33
target_sdk_version = 33
min_sdk_version = 26
# Practically every phone in use today is 64-bit ARM.
build_targets = ["aarch64-linux-android"]
fullscreen = true
# The launcher icon, rendered by `cargo run -- --render-icons`.
res = "android/res"
icon = "@mipmap/ic_launcher"

[package.metadata.android.activity_attributes]
# Landscape either way round, following how the phone is held.
"android:screenOrientation" = "sensorLandscape"
# Android 12+ requires this on the activity the launcher opens.
"android:exported" = "true"

# A copy of miniquad 0.4.11 (macroquad's platform layer) with small fixes;
# see vendor/README.md.
[patch.crates-io]
miniquad = { path = "vendor/miniquad" }

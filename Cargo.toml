[package]
name = "konsonanttitekniikka"
version = "0.1.0"
edition = "2024"

# Capitalized because macOS shows the executable's name in the menu bar.
[[bin]]
name = "Konsonanttitekniikka"
path = "src/main.rs"

[dependencies]
macroquad = { version = "0.4.16", features = ["audio"] }

# Optimize dependencies even in debug builds so the game runs smoothly,
# while keeping our own code fast to compile.
[profile.dev.package."*"]
opt-level = 3

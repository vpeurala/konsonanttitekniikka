version: 2
updates:
  # The Rust crates in Cargo.lock. The vendored miniquad is a patched copy
  # (see vendor/README.md), so its updates are done by hand.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # One pull request for the routine updates instead of one per crate.
      minor-and-patch:
        update-types: [minor, patch]
  # The actions used by the workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

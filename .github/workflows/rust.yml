name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    # macroquad's audio and window code needs these Linux libraries.
    - name: Install system libraries
      run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev
    - name: Check formatting
      run: cargo fmt --check
    - name: Lint
      run: cargo clippy --all-targets -- -D warnings
    # The web build is the game's main home, so it is linted too.
    - name: Lint the web build
      run: |
        rustup target add wasm32-unknown-unknown
        cargo clippy --target wasm32-unknown-unknown -- -D warnings
    - name: Run tests
      run: cargo test --verbose

  # Test coverage, sent to Codecov for the README badge. Files that only draw
  # or start the app (pictures, sprites, the icon, fonts, the render code,
  # the booklet's picture rendering, main, analytics) are left out: the tests can't run them without a screen,
  # and counting them would hide how well the game's logic is tested.
  coverage:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install system libraries
      run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev
    - name: Install coverage tools
      uses: taiki-e/install-action@cargo-llvm-cov
    - name: Measure coverage
      run: >
        cargo llvm-cov --lcov --output-path lcov.info
        --ignore-filename-regex 'src/(main|fonts|icon|pictures|sprites|analytics)\.rs|src/game/render\.rs|src/booklet/images\.rs'
    - name: Upload to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: lcov.info
        token: ${{ secrets.CODECOV_TOKEN }}
        # A missing token or a Codecov outage shouldn't turn the build red.
        fail_ci_if_error: false

  # Builds the game for Windows, which proves it still compiles there and
  # gives a downloadable lukuloitsu.exe (Actions run page, "Artifacts").
  windows:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --release
    - name: Upload the executable
      uses: actions/upload-artifact@v4
      with:
        name: lukuloitsu-windows
        path: target/release/lukuloitsu.exe

  # Builds the user booklet as a PDF, which proves the booklet still renders
  # and gives a copy to look at (Actions run page, "Artifacts"). Releases
  # attach it too; see release.yml.
  booklet:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    # The pictures are drawn by the game's own code, which needs a window,
    # so run under a virtual display with software OpenGL.
    - name: Install system libraries
      run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev libgl1-mesa-dri xvfb
    - name: Build the booklet
      run: xvfb-run -a scripts/booklet.sh
    - name: Upload the booklet
      uses: actions/upload-artifact@v4
      with:
        name: lukuloitsu-opas
        path: target/booklet/lukuloitsu-opas.pdf

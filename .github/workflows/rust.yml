name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    # macroquad's audio and window code needs these Linux libraries.
    - name: Install system libraries
      run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev
    - name: Check formatting
      run: cargo fmt --check
    - name: Lint
      run: cargo clippy --all-targets -- -D warnings
    # The web build is the game's main home, so it is linted too.
    - name: Lint the web build
      run: |
        rustup target add wasm32-unknown-unknown
        cargo clippy --target wasm32-unknown-unknown -- -D warnings
    - name: Run tests
      run: cargo test --verbose

  # Test coverage, sent to Codecov for the README badge. Files that only draw
  # or start the app (pictures, sprites, the icon, fonts, the render code,
  # main, analytics) are left out: the tests can't run them without a screen,
  # and counting them would hide how well the game's logic is tested.
  coverage:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install system libraries
      run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev
    - name: Install coverage tools
      uses: taiki-e/install-action@cargo-llvm-cov
    - name: Measure coverage
      run: >
        cargo llvm-cov --lcov --output-path lcov.info
        --ignore-filename-regex 'src/(main|fonts|icon|pictures|sprites|analytics)\.rs|src/game/render\.rs'
    - name: Upload to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: lcov.info
        token: ${{ secrets.CODECOV_TOKEN }}
        # A missing token or a Codecov outage shouldn't turn the build red.
        fail_ci_if_error: false

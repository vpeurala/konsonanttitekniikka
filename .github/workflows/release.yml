name: Release

# Publishes the Windows, macOS and Linux builds and the user booklet on a GitHub Release when a version tag is
# pushed (git tag 0.3.0 && git push origin 0.3.0). Run it by hand from the
# Actions tab to add the build to a tag that already exists.
on:
  push:
    tags: [ "[0-9]+.[0-9]+.[0-9]+" ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. 0.2.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  windows:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.TAG }}
    - name: Build
      run: cargo build --release
    # The licenses travel with the binary: it contains the fonts too.
    - name: Make the zip
      shell: pwsh
      run: |
        Compress-Archive -DestinationPath lukuloitsu-windows.zip -Path `
          target/release/lukuloitsu.exe, LICENSE-MIT, LICENSE-APACHE, `
          assets/fonts/OFL-Nunito.txt, assets/fonts/OFL-Fredoka.txt
    - name: Publish the release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if gh release view "$TAG" >/dev/null 2>&1; then
          gh release upload "$TAG" lukuloitsu-windows.zip --clobber
        else
          gh release create "$TAG" lukuloitsu-windows.zip \
            --title "Lukuloitsu $TAG" \
            --notes-file .github/release-notes.md
        fi

  # The macOS and Linux builds join the release the Windows job made.
  # scripts/macos-app.sh and scripts/linux-package.sh do the work, and CI
  # (rust.yml) runs them on every push, so a tag rarely finds them broken.
  # Tags from before 0.4.3 don't have the scripts.
  macos:

    needs: windows
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.TAG }}
    - name: Build the app
      run: scripts/macos-app.sh
    - name: Attach it to the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release upload "$TAG" target/macos/lukuloitsu-macos.zip --clobber

  linux:

    needs: windows
    # An older Ubuntu, so the program runs on older distributions too.
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.TAG }}
    - name: Install system libraries
      run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev
    - name: Build and pack it
      run: scripts/linux-package.sh
    - name: Attach it to the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release upload "$TAG" target/linux/lukuloitsu-linux.tar.gz --clobber

  # The user booklet (in Finnish), made by the game's own program from the
  # same tag. Needs the release to exist, so it waits for the Windows job.
  # Tags from before 0.4.0 can't make it: they don't have the booklet yet.
  booklet:

    needs: windows
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.TAG }}
    - name: Install system libraries
      run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev libgl1-mesa-dri xvfb
    - name: Build the booklet
      run: xvfb-run -a scripts/booklet.sh
    - name: Attach it to the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release upload "$TAG" target/booklet/lukuloitsu-opas.pdf --clobber
